<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirme seu código — Accuracy</title>
<link rel="stylesheet" href="css/confirmacodigo.css">
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 17 9 11 13 15 21 7"/>
      </svg>
    </div>
    <div class="brand-name">Accuracy</div>
  </div>

  <div class="card">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h1>Confirme seu código</h1>
    <p class="subtitle">Enviamos um código de 6 dígitos para<br><strong>n****@email.com</strong></p>

    <div class="code-row" id="codeRow">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" data-index="0">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" data-index="1">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" data-index="2">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" data-index="3">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" data-index="4">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" data-index="5">
    </div>

    <div class="status-row" id="statusRow"></div>

    <button class="btn" id="confirmBtn" disabled>Confirmar código</button>

    <div class="resend">
      Não recebeu o código? <a href="#" id="resendLink">Reenviar (<span class="timer" id="timer">30s</span>)</a>
    </div>
  </div>

  <a href="#" class="back-link">← Voltar ao login</a>
</div>

<script>
  const inputs = Array.from(document.querySelectorAll('.code-input'));
  const btn = document.getElementById('confirmBtn');
  const statusRow = document.getElementById('statusRow');
  const resendLink = document.getElementById('resendLink');
  const timerEl = document.getElementById('timer');

  function updateButtonState(){
    const filled = inputs.every(i => i.value.length === 1);
    btn.disabled = !filled;
  }

  inputs.forEach((input, idx) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = val;
      if(val){
        e.target.classList.add('filled');
        e.target.classList.remove('error');
        if(idx < inputs.length - 1){ inputs[idx + 1].focus(); }
      } else {
        e.target.classList.remove('filled');
      }
      statusRow.textContent = '';
      statusRow.className = 'status-row';
      updateButtonState();
    });

    input.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !input.value && idx > 0){
        inputs[idx - 1].focus();
      }
    });

    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
      paste.split('').forEach((char, i) => {
        if(inputs[i]){
          inputs[i].value = char;
          inputs[i].classList.add('filled');
        }
      });
      const next = inputs[Math.min(paste.length, inputs.length - 1)];
      next.focus();
      updateButtonState();
    });
  });

  btn.addEventListener('click', () => {
    const code = inputs.map(i => i.value).join('');
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    setTimeout(() => {
      if(code === '123456'){
        statusRow.className = 'status-row success';
        statusRow.textContent = 'Código confirmado com sucesso.';
        btn.textContent = 'Confirmado ✓';
      } else {
        statusRow.className = 'status-row error';
        statusRow.textContent = 'Código incorreto. Tente novamente.';
        btn.textContent = 'Confirmar código';
        btn.disabled = false;
        inputs.forEach(i => i.classList.add('error'));
      }
    }, 800);
  });

  // Countdown para reenvio
  let seconds = 30;
  const countdown = setInterval(() => {
    seconds--;
    if(seconds <= 0){
      clearInterval(countdown);
      timerEl.textContent = '';
      resendLink.innerHTML = 'Reenviar código';
    } else {
      timerEl.textContent = seconds + 's';
    }
  }, 1000);

  inputs[0].focus();
</script>

</body>
</html>
